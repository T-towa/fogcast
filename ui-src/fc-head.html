<title>Fogcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a TV set on a rainy night. Top: wordmark, channel dial, calendar HUD.
   Body: the TV (every channel at once, or one) beside a glass rail (forecast, social links, details).
   Bottom: the one line the terminal's status bar shows. Rain = current pace, fog = how close the weekly limit is. */
:root{
  --night:#06070c;
  --ink:#f3efe2;
  --mute:rgba(243,239,226,.78);
  --faint:rgba(243,239,226,.56);
  --yolk:#ffd931;
  --yolk-ink:#15110a;
  --teal:#3fe6d6;
  --teal-ink:#03130f;
  --rose:#ff86c0;
  --sky:#93b4ff;
  --alarm:#ff6a55;
  --glass:rgba(20,24,36,.5);
  --rim:rgba(255,255,255,.15);
  --line:rgba(243,239,226,.1);
  --well:rgba(0,0,0,.24);
  --f-disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-osd:"DotGothic16",ui-monospace,"SFMono-Regular",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --skew:-9deg;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:500 14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.9em}
h1,h2,h3{text-wrap:balance}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:14px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{50%{transform:scale(.7);opacity:.6}}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 38%,rgba(255,255,255,.035)),var(--glass);
  border:1px solid var(--rim);border-radius:var(--r,22px);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.35),0 18px 50px rgba(0,0,0,.45)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 10% -12%,rgba(255,255,255,.14),transparent 55%),radial-gradient(90% 50% at 100% 112%,rgba(63,230,214,.12),transparent 60%),linear-gradient(115deg,transparent 42%,rgba(255,255,255,.05) 47%,transparent 53%)}

/* ---------- P4 tags ---------- */
.tag{display:inline-block;font-family:var(--f-disp);font-size:13px;line-height:1.5;letter-spacing:.06em;color:var(--yolk-ink);background:var(--yolk);padding:1px 12px 0;transform:skewX(var(--skew));box-shadow:3px 3px 0 #000;white-space:nowrap}
.tag.teal{background:var(--teal);color:var(--teal-ink)}

/* ---------- header ---------- */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 20px;align-items:center}
/* a narrow window: the dial takes a row of its own */
@media (min-width:901px) and (max-width:1180px){
  .hud{grid-column:3;grid-row:1}
  .dial{grid-column:1/-1;grid-row:2}
}
/* 設定: a gear at the end of the message box's buttons (on 全チャンネル, at the end of its heading); the dot says whether this screen can approve */
.setBtn{--c:#8a90a0;position:relative;display:inline-grid;place-items:center;padding:0 11px;min-width:42px;color:var(--yolk)}
.setBtn svg{width:19px;height:19px;display:block}
.setBtn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #10131c}
.setBtn.on{--c:var(--teal)}
.setBtn.half{--c:var(--yolk)}
.setBtn.half .dot{animation:blink 1.2s steps(2) infinite}
.setBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.wallHead .setBtn{margin-left:auto;height:34px;border-radius:10px}
.tool{font:700 11px/1 var(--f-body);padding:4px 9px 3px;border:1px solid rgba(243,239,226,.4);background:rgba(255,255,255,.05);color:var(--ink);letter-spacing:.06em;text-decoration:none;cursor:pointer;white-space:nowrap}
.tool:hover,.tool:focus-visible{background:var(--ink);color:var(--night);border-color:var(--ink);outline:none}
.rx .tool:first-of-type,.rx .pz{margin-left:2px}
.tool[hidden]{display:none}
.pz{font:700 10.5px/1 var(--f-body);padding:3px 7px 2px;border:1px solid var(--faint);background:none;color:var(--mute);letter-spacing:.06em;cursor:pointer}
.pz[aria-pressed="true"]{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk)}
.pz[hidden]{display:none}
.brand{display:grid;gap:4px;min-width:0}
.mark{font-family:var(--f-disp);font-size:31px;line-height:1;letter-spacing:.03em;color:var(--yolk);transform:skewX(var(--skew));transform-origin:left bottom;text-shadow:3px 3px 0 #000,0 0 24px rgba(255,217,49,.35);margin:0;font-weight:400}
.demo{font:700 10.5px/1 var(--f-body);padding:3px 6px 2px;border:1px solid var(--faint);color:var(--mute);letter-spacing:.1em}
.rx{font:600 12.5px/1.2 var(--f-body);color:var(--teal);letter-spacing:.02em;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.rx .demo{margin-left:4px}
.rx i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 1.6s steps(2) infinite}

.dial{display:flex;align-items:center;gap:12px;min-width:0}
.knob{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--rim);padding:0;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.32),rgba(255,255,255,.05) 42%,rgba(0,0,0,.45) 100%),#141925;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.2),inset 0 -3px 7px rgba(0,0,0,.65),0 8px 18px rgba(0,0,0,.5)}
.knob .kn{position:relative;width:36px;height:36px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.13) 0 5deg,transparent 5deg 15deg),#0c0f17;transform:rotate(var(--ang,-100deg));transition:transform .5s cubic-bezier(.3,1.6,.45,1)}
.knob .kn i{position:absolute;left:50%;top:3px;width:4px;height:12px;margin-left:-2px;border-radius:2px;background:var(--yolk);box-shadow:0 0 8px var(--yolk)}
.chs{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:6px 6px 8px 4px;min-width:0}
.chs::-webkit-scrollbar{display:none}
.ch{flex:none;border:0;background:none;padding:0}
.ch .in{display:flex;align-items:center;gap:8px;padding:7px 14px 6px;background:rgba(12,15,24,.74);border:1px solid var(--rim);transform:skewX(var(--skew));transition:transform .18s,background .18s,color .18s}
.ch .n{font:16px/1 var(--f-osd);color:var(--teal)}
.ch .nm{font-weight:700;font-size:13px;line-height:1.2}
.ch:hover .in{transform:skewX(var(--skew)) translateY(-2px)}
.ch[aria-selected="true"] .in{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk);box-shadow:4px 4px 0 #000}
.ch[aria-selected="true"] .n{color:var(--yolk-ink)}
.ch[aria-selected="true"] .dot{box-shadow:0 0 0 2px var(--yolk-ink)}
.ch.add .in{background:transparent;border-style:dashed;color:var(--mute)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.work{background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 1.2s ease-in-out infinite}
.dot.wait{background:var(--yolk);animation:blink .7s steps(2) infinite}
.dot.idle{background:var(--mute)}
.dot.off{background:transparent;border:1px solid var(--faint)}
/* a laptop: the channel chips draw closer so the dial keeps its names */
@media (max-width:1440px){
  .top{column-gap:14px}
  .chs{gap:6px}
  .ch .in{gap:6px;padding:6px 10px 5px}
}
@media (max-width:1320px){ .mark{font-size:27px} }

.hud{display:flex;align-items:center;border:0;padding:0 2px 0 0;background:none;text-align:left}
.hud .d{display:flex;align-items:flex-end;gap:7px;background:var(--yolk);color:var(--yolk-ink);padding:7px 26px 5px 16px;transform:skewX(var(--skew));box-shadow:4px 4px 0 #000}
.hud .d b{font-family:var(--f-disp);font-weight:400;font-size:31px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hud .d i{font-style:normal;font-family:var(--f-disp);font-size:13px;line-height:1;background:var(--yolk-ink);color:var(--yolk);padding:4px 6px 3px;margin-bottom:2px}
.hud .w{position:relative;z-index:1;width:56px;height:56px;margin-left:-16px;border-radius:50%;display:grid;place-items:center;background:#0b0e16;border:3px solid var(--yolk);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.hud .w svg{width:36px;height:36px}
.hud .t{display:grid;gap:2px;padding:0 0 0 12px;min-width:0}
.hud .t b{font-family:var(--f-disp);font-weight:400;font-size:15px;line-height:1.1;color:var(--teal);letter-spacing:.16em}
.hud .t span{font-size:12.5px;color:var(--mute);white-space:nowrap}
.hud .t span em{font-style:normal;color:var(--ink)}
.hud:hover .d{filter:brightness(1.06)}

/* ---------- body ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 388px;gap:16px;align-items:start}
.tv{--r:32px;padding:12px;display:grid;gap:10px;min-width:0}
.tv::after{content:"";position:absolute;left:28px;right:28px;top:5px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,217,49,.5) 18%,rgba(63,230,214,.5) 82%,transparent);pointer-events:none}
/* the message box below takes the room it grows by (--askGrow) from here, down to a floor */
.screen{position:relative;height:clamp(max(300px,calc(470px - var(--askGrow,0px))),calc(100vh - 252px - var(--askGrow,0px)),1000px);border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 38%,#0d1627 0%,#070b14 55%,#04060b 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 0 70px rgba(0,0,0,.85),inset 0 0 140px rgba(63,230,214,.05)}
.view{position:absolute;inset:0;z-index:1;overflow:auto;padding:16px 18px 18px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
/* glass over the picture: a soft vignette and one diagonal reflection, no scanlines */
.glare{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;
  background:linear-gradient(118deg,transparent 0 58%,rgba(255,255,255,.035) 63%,transparent 70%),radial-gradient(130% 110% at 50% 50%,transparent 62%,rgba(0,0,0,.45))}
/* fog: rises from the bottom as the context fills, clears when it is compacted */
.fogl{position:absolute;left:0;right:0;bottom:0;z-index:0;pointer-events:none;height:calc(var(--fog,0) * 100%);opacity:calc(.25 + var(--fog,0) * .75);transition:height 1.4s cubic-bezier(.3,.8,.3,1),opacity 1.4s;border-radius:inherit;
  background:radial-gradient(70% 70% at 22% 100%,rgba(205,216,238,.5),transparent 72%),radial-gradient(60% 65% at 78% 100%,rgba(205,216,238,.42),transparent 72%),linear-gradient(0deg,rgba(205,216,238,.3),rgba(205,216,238,0));
  background-size:150% 100%,170% 100%,100% 100%;background-repeat:no-repeat;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 100%,100% 100%,0 0}to{background-position:45% 100%,55% 100%,0 0}}
/* channel change: a yellow band sweeps across, the picture changes behind it */
.wipe{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden;border-radius:inherit}
.wipe .band{position:absolute;top:-30%;bottom:-30%;left:-25%;width:150%;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--yolk);color:var(--yolk-ink);transform:translateX(-140%) skewX(-16deg)}
.wipe .band::before,.wipe .band::after{content:"";position:absolute;top:0;bottom:0}
.wipe .band::before{left:-34px;width:22px;background:#000}
.wipe .band::after{left:-52px;width:10px;background:var(--teal)}
.wipe .band b,.wipe .band small{transform:skewX(16deg)}
.wipe .band b{font:400 clamp(44px,7vw,92px)/1 var(--f-disp);letter-spacing:.02em}
.wipe .band small{font:700 clamp(15px,1.6vw,20px)/1.2 var(--f-body)}
/* a second and a half in all: sweeps in, holds the channel's number for a beat, sweeps out */
.wipe.go .band{animation:wipe 1.5s cubic-bezier(.75,0,.25,1)}
@keyframes wipe{0%{transform:translateX(-140%) skewX(-16deg)}40%,60%{transform:translateX(0) skewX(-16deg)}100%{transform:translateX(140%) skewX(-16deg)}}
/* a session that has ended: the test bars of a station that has signed off */
.bars,.screen.off::before{background:linear-gradient(90deg,#c8c8c8 0 14.3%,#c8c23c 0 28.6%,#3cc2c2 0 42.9%,#3cc23c 0 57.2%,#c23cc2 0 71.5%,#c23c3c 0 85.8%,#3c3cc2 0)}
.bars{display:none;position:absolute;left:0;right:0;top:0;height:6px;opacity:.55;z-index:2}
.tile.off .bars{display:block}
.screen.off::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;opacity:.5;z-index:5}
.osdBig{position:absolute;top:14px;right:20px;z-index:6;font:46px/1 var(--f-osd);color:var(--teal);text-shadow:0 0 14px rgba(63,230,214,.6),3px 3px 0 #000;opacity:0;pointer-events:none;transition:opacity .9s}
.osdBig small{display:block;font-size:15px;text-align:right;margin-top:4px;color:var(--ink)}
.osdBig.on{opacity:1;transition:none}
.screen.power .view{animation:power .7s cubic-bezier(.2,.9,.2,1)}
@keyframes power{0%{transform:scale(1,.004);filter:brightness(4)}35%{transform:scale(1,.004);filter:brightness(4)}70%{transform:scale(1,1);filter:brightness(1.6)}100%{transform:none;filter:none}}

/* wall */
.wallHead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:2px 0 12px}
.wallHead .sum{font-size:12.5px;color:var(--mute)}
.wallHead .sum b{color:var(--ink);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:grid;gap:7px;align-content:start;min-height:158px;border-radius:16px;padding:12px 14px;text-align:left;
  background:linear-gradient(180deg,rgba(17,26,43,.92),rgba(7,11,19,.96));border:1px solid rgba(255,255,255,.1);overflow:hidden;transition:border-color .2s,transform .2s}
.tile:hover{border-color:rgba(255,217,49,.55);transform:translateY(-2px)}
.tile>span:not(.fogl):not(.bars){position:relative;z-index:1}
.tile .meta,.tile .now{display:block}
.tile .fogl{z-index:0}
.tile .hd{display:flex;align-items:center;gap:8px}
.tile .n{font:24px/1 var(--f-osd);color:var(--teal);text-shadow:0 0 10px rgba(63,230,214,.5)}
.tile .nm{font-weight:700;font-size:14px}
.tile .hd .chip{margin-left:auto}
.tile .meta{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .now{font-size:13px;line-height:1.55;min-height:3.1em;overflow-wrap:anywhere}
.tile .now code{font-size:12px}
.tile .ops{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.tile .ops i{font:600 10.5px/1 var(--f-mono);font-style:normal;padding:3px 5px 2px;border:1px solid rgba(255,255,255,.14);color:var(--mute)}
.tile .ops i.on{border-color:var(--yolk);color:var(--yolk-ink);background:var(--yolk)}
.tile .ft{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11.5px;color:var(--mute)}
.tile .ft b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.tile .ft,.tile .ops{text-shadow:0 1px 3px rgba(0,0,0,.8)}
.tile.wait{border-color:transparent}
.tile.wait::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;padding:3px;pointer-events:none;
  background:repeating-linear-gradient(-45deg,var(--yolk) 0 10px,#111 10px 20px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:tape 1.2s linear infinite}
@keyframes tape{to{background-position:28px 0}}
.tile.off .now,.tile.off .nm{color:var(--faint)}
.tile.boot{animation:power .8s cubic-bezier(.2,.9,.2,1)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid var(--rim);white-space:nowrap}
.chip.work{color:var(--teal);border-color:rgba(63,230,214,.45)}
.chip.wait{color:var(--yolk-ink);background:var(--yolk);border-color:var(--yolk);font-weight:700}
.chip.idle{color:var(--mute)}
.chip.off{color:var(--faint);border-style:dashed}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:12px;vertical-align:-1px}
.sig i{width:3px;background:rgba(255,255,255,.18)}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px}.sig i:nth-child(5){height:12px}
.sig i.on{background:var(--teal)}
.sig.low i.on{background:var(--yolk)}
.sig.bad i.on{background:var(--alarm)}

/* program guide */
.guide{margin-top:18px;display:grid;gap:8px}
.gHead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.gHead .s{font-size:12px;color:var(--mute)}
.gGrid{display:grid;grid-template-columns:96px minmax(0,1fr);gap:5px 10px;align-items:center}
.gLab{display:flex;gap:7px;align-items:center;min-width:0;font-size:12.5px;border:0;background:none;padding:0;text-align:left}
.gLab .n{font:15px/1 var(--f-osd);color:var(--teal)}
.gLab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gRow{position:relative;height:30px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);overflow:hidden}
.gRow::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(255,255,255,.06) calc(25% - 1px) 25%)}
.gB{position:absolute;top:3px;bottom:3px;min-width:2px;background:linear-gradient(180deg,rgba(63,230,214,.62),rgba(63,230,214,.36));border-left:2px solid var(--teal);font-size:10.5px;line-height:22px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--teal-ink);font-weight:500}
.gB.wait{background:repeating-linear-gradient(-45deg,var(--yolk) 0 6px,#2a2306 6px 12px);border-left-color:var(--yolk);color:transparent}
.gB.live{box-shadow:0 0 14px rgba(63,230,214,.55)}
.gEnd{position:absolute;top:0;bottom:0;width:1px;background:var(--faint)}
.gEnd span{position:absolute;left:6px;top:6px;font-size:10.5px;color:var(--faint);white-space:nowrap}
.gNow{position:absolute;top:0;bottom:0;right:0;width:2px;background:var(--yolk);box-shadow:0 0 8px var(--yolk)}
.gAxis{grid-column:2;position:relative;height:16px;font:11px/16px var(--f-mono);color:var(--faint)}
.gAxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.gAxis span:first-child{transform:none}
.gAxis span:last-child{transform:translateX(-100%);color:var(--yolk)}

/* channel view */
.osd{position:sticky;top:-16px;margin:-16px -18px 12px;padding:14px 18px 12px;z-index:3;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  background:linear-gradient(180deg,rgba(7,11,20,.97) calc(100% - 12px),rgba(7,11,20,0))}
.osd .n{font:32px/1 var(--f-osd);color:var(--teal);text-shadow:0 0 12px rgba(63,230,214,.55),2px 2px 0 #000}
.osd .nm{font-family:var(--f-disp);font-size:20px;line-height:1.1;transform:skewX(var(--skew))}
/* the role, folder and branch give way first: the pickers and the numbers stay on the line */
.osd .meta{font-size:12.5px;color:var(--mute);flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the model and the effort: each opens its picker */
.osd .picks{display:inline-flex;gap:6px;flex:none}
.osdPick{font:600 12px/1 var(--f-body);padding:5px 10px 4px;border-radius:999px;border:1px solid rgba(63,230,214,.45);background:rgba(63,230,214,.08);color:var(--ink);cursor:pointer;white-space:nowrap}
.osdPick b{font-weight:700;color:var(--teal)}
.osdPick:hover{background:rgba(63,230,214,.16)}
.osdPick:disabled{opacity:.4;cursor:default}
.osd .right{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--mute)}
.osd .right b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0 0 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.turn{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;min-width:0}
.turn .full{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;min-width:0}
.turn.folded .full{display:none}
.fold{display:none;gap:10px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-size:12.5px}
.turn.folded .fold{display:flex}
.fold:hover{border-color:rgba(255,217,49,.4)}
.fold .tn{font:700 12.5px/1 var(--f-body);color:var(--teal);white-space:nowrap}
.fold .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .k{color:var(--faint);white-space:nowrap;font-size:11.5px}
.you{display:flex;gap:10px;align-items:flex-start;max-width:min(720px,100%)}
.you .who{flex:none;font:12px/1 var(--f-disp);color:var(--yolk-ink);background:var(--yolk);padding:5px 8px 4px;transform:skewX(var(--skew));margin-top:3px}
.you .body{font-size:14.5px;line-height:1.7;min-width:0}
.ops{list-style:none;margin:0 0 0 4px;padding:4px 0 4px 12px;border-left:1px solid rgba(255,255,255,.12);display:grid;gap:3px}
.ops:empty{display:none}
.op{display:grid;grid-template-columns:2.8em 6.4em minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:12.5px}
.op .num{font:600 11px/1 var(--f-mono);color:var(--faint);text-align:right}
.op .v{font-family:var(--f-mono);font-size:12px;color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .x{font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .r{font-size:11.5px;color:var(--mute);white-space:nowrap}
.op.k-skill .v{color:var(--yolk)}.op.k-agent .v{color:var(--rose)}.op.k-mcp .v{color:var(--sky)}
.op.run .r::after{content:"実行中";color:var(--yolk);animation:blink 1s steps(2) infinite}
.op.sub{padding-left:1.2em}
.op.sub .num::before{content:"└ ";color:var(--faint)}
.ans{font-size:14.5px;line-height:1.85;max-width:72ch}
.ans:empty{display:none}
.ans code,.you code,.sys code,.perm code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.typing::after{content:"▍";color:var(--teal);animation:blink 1s steps(2) infinite}
.turnFt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--faint)}
.turnFt:empty{display:none}
.sys{font-size:12.5px;color:var(--mute);border:1px dashed rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.sys b{color:var(--ink);font-weight:500}
.sys .row{display:flex;flex-wrap:wrap;gap:4px 14px}
.sys .row span{white-space:nowrap}
.boot{border-style:solid;border-color:rgba(63,230,214,.3);background:rgba(63,230,214,.05)}
.perm{position:relative;border-radius:14px;padding:16px 14px 12px;background:rgba(26,22,5,.88);border:1px solid rgba(255,217,49,.45);display:grid;gap:4px;overflow:hidden}
.perm::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(-45deg,var(--yolk) 0 8px,#111 8px 16px);animation:tape 1.2s linear infinite}
.perm b{font-family:var(--f-disp);font-weight:400;color:var(--yolk);letter-spacing:.06em}
.perm p{margin:0;font-size:12.5px}
.perm .s{color:var(--mute);font-size:11.5px}
.live{position:sticky;bottom:-18px;margin:10px -18px -18px;padding:12px 18px 14px;z-index:3;display:flex;gap:10px;align-items:center;font-size:12.5px;
  background:linear-gradient(0deg,rgba(7,11,20,.97) 70%,rgba(7,11,20,0))}
.live .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .txt code{font-size:12px}
.live .el{margin-left:auto;font:12px/1 var(--f-mono);color:var(--faint)}
/* back to the latest: there while you read further up; yellow, with a count, once messages came meanwhile */
.toEnd{position:absolute;right:20px;bottom:58px;z-index:5;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;min-width:38px;padding:0 10px;
  border-radius:999px;border:2px solid var(--teal);background:rgba(7,11,20,.92);color:var(--teal);box-shadow:3px 3px 0 #000;cursor:pointer;
  font:700 12.5px/1 var(--f-body);letter-spacing:.02em;white-space:nowrap;animation:toEndIn .18s cubic-bezier(.2,.9,.2,1)}
.toEnd[hidden]{display:none}
.toEnd svg{width:17px;height:17px;flex:none}
.toEnd:hover{background:#0e2a2b}
.toEnd:focus-visible{outline:3px solid #fff;outline-offset:2px}
.toEnd.new{padding:0 12px 0 14px;background:var(--yolk);border-color:#000;color:var(--yolk-ink);animation:toEndIn .18s cubic-bezier(.2,.9,.2,1),toEndPing 1.6s ease-out .2s 2}
.toEnd.new:hover{background:#ffe46a}
.toEnd .nw:empty{display:none}
@keyframes toEndIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toEndPing{0%{box-shadow:3px 3px 0 #000,0 0 0 0 rgba(255,217,49,.55)}70%{box-shadow:3px 3px 0 #000,0 0 0 12px rgba(255,217,49,0)}100%{box-shadow:3px 3px 0 #000,0 0 0 0 rgba(255,217,49,0)}}
/* the turn a history card went to, lit for a moment */
.log>li.hit{border-radius:14px;animation:hit 1.7s ease-out}
@keyframes hit{0%,35%{box-shadow:0 0 0 2px var(--yolk),0 0 26px rgba(255,217,49,.32)}100%{box-shadow:0 0 0 2px rgba(255,217,49,0),0 0 26px rgba(255,217,49,0)}}

/* ---------- rail: history — a card a turn, newest first ---------- */
.hcards{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hc{position:relative;width:100%;display:grid;gap:5px;text-align:left;padding:10px 12px 10px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.24);
  color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.hc::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 2px 2px 0;background:rgba(243,239,226,.2)}
.hc:hover{background:rgba(255,255,255,.07);border-color:rgba(255,217,49,.55)}
.hc:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hc.here{border-color:var(--yolk);background:rgba(255,217,49,.07)}
.hc.here::before{background:var(--yolk)}
.hc.run::before{background:var(--teal)}
.hc.ask::before,.hc.wait::before{background:var(--yolk)}
.hc.stop::before{background:var(--alarm)}
.hh{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;font-size:11.5px;color:var(--faint)}
.hh b{font:700 12.5px/1.2 var(--f-body);color:var(--teal);letter-spacing:.04em}
.hh time{font:11.5px/1 var(--f-mono);color:var(--mute)}
.hch{font:700 11px/1 var(--f-body);color:var(--yolk-ink);background:var(--yolk);padding:3px 6px 2px}
.hst{margin-left:auto;font:700 10.5px/1 var(--f-body);padding:3px 7px 2px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.hst.run{color:var(--teal)}
.hst.ask,.hst.wait{color:var(--yolk)}
.hst.stop{color:var(--alarm)}
.hp{font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ha{font-size:12px;line-height:1.55;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ha i{font-style:normal;font:700 10.5px/1 var(--f-body);color:var(--ink);margin-right:6px;padding:2px 5px 1px;border:1px solid rgba(243,239,226,.3)}
.hf{font-size:11px;line-height:1.3;color:var(--faint)}
.hm{display:flex}
.hmk{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--faint);font-size:11.5px;padding:3px 2px;cursor:pointer;min-width:0}
.hmk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmk::before,.hmk::after{content:"";flex:1 1 12px;height:1px;background:rgba(243,239,226,.16)}
.hmk:hover,.hmk:focus-visible{color:var(--ink);outline:none}

/* arcana cut-in */
.cutin{position:absolute;right:22px;bottom:70px;z-index:6;width:118px;pointer-events:none;opacity:0;transform:translateX(170%) rotate(8deg)}
.cutin.show{animation:cut 2s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes cut{0%{transform:translateX(170%) rotate(8deg);opacity:0}16%{transform:translateX(0) rotate(-4deg);opacity:1}82%{transform:translateX(0) rotate(-4deg);opacity:1}100%{transform:translateX(24%) rotate(2deg);opacity:0}}
.cutin .lbl{position:absolute;left:-14px;right:-14px;bottom:-12px;text-align:center}
.cutin .lbl .tag{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* controls under the screen */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:end;padding:0 2px 2px}
/* it grows with what is typed (askFit sets its height), then scrolls inside */
.ctl textarea{width:100%;min-height:46px;resize:none;overflow-y:hidden;background:rgba(0,0,0,.38);border:1px solid var(--rim);border-radius:14px;padding:11px 14px;line-height:1.5;scrollbar-width:thin}
.ctl textarea::placeholder{color:var(--faint)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--rim);background:rgba(255,255,255,.06);border-radius:12px;padding:9px 14px;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk);font-weight:700;box-shadow:3px 3px 0 #000}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:12px;border-radius:10px}
/* the box and its buttons share a row; the suggestion's button sits inside the box's right end */
.ctl textarea{grid-column:1;grid-row:1}
.btns{grid-column:2;grid-row:1}
.sgtIn{grid-column:1;grid-row:1;justify-self:end;align-self:center;z-index:1;margin-right:8px;display:inline-flex;align-items:center;gap:7px;padding:5px 7px 4px 11px;border-radius:999px;
  border:1px solid rgba(63,230,214,.45);background:rgba(7,20,22,.9);color:var(--teal);font:700 11.5px/1 var(--f-body);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.sgtIn kbd{font:600 10px/1 var(--f-mono);padding:2px 5px 1px;border:1px solid currentColor;border-radius:4px;opacity:.85}
.sgtIn:hover,.sgtIn:focus-visible{background:var(--teal);color:var(--teal-ink);outline:none}
.sgtIn[hidden]{display:none}
.ctl.sg textarea{padding-right:132px}
.ctl.sg textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- rail ---------- */
.rail{--r:26px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-width:0}
.rtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:2px 6px 4px 4px}
.rt{border:0;background:none;padding:0}
.rt span{position:relative;isolation:isolate;display:block;text-align:center;padding:8px 4px 7px;font:700 13.5px/1.2 var(--f-body);letter-spacing:.04em}
.rt span::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.05);border:1px solid var(--rim);transform:skewX(var(--skew));transition:background .18s}
.rt:hover span::before{background:rgba(255,255,255,.1)}
.rt[aria-selected="true"] span{color:var(--yolk-ink)}
.rt[aria-selected="true"] span::before{background:var(--yolk);border-color:var(--yolk);box-shadow:3px 3px 0 #000}
.pane{overflow:auto;min-height:0;display:grid;gap:12px;align-content:start;padding:2px 2px 6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.blk{display:grid;gap:9px;padding:12px 13px;border-radius:16px;background:var(--well);border:1px solid rgba(255,255,255,.07);min-width:0}
.blk h3{margin:0;font:700 14.5px/1.35 var(--f-body);letter-spacing:.04em;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px}
.blk h3 small{font-size:12px;font-weight:500;color:var(--faint);letter-spacing:0;text-align:left}
.note{margin:0;font-size:12px;color:var(--faint);line-height:1.65}

/* forecast */
.fc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.fc .ico{width:58px;height:58px;grid-row:span 2;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid var(--yolk)}
.fc .ico svg{width:40px;height:40px}
.fc .big{font-family:var(--f-disp);font-size:27px;line-height:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-variant-numeric:tabular-nums}
.fc .big small{font-family:var(--f-body);font-size:12px;color:var(--mute)}
.fc .says{font-size:12.5px;line-height:1.5}
.fc .says.bad{color:var(--alarm)}
.meter{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.meter .now{position:absolute;left:0;top:0;bottom:0;background:var(--yolk);border-radius:6px 0 0 6px}
.meter .fut{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,rgba(255,217,49,.55) 0 4px,rgba(255,217,49,.14) 4px 8px)}
.meter .fut.over{background:repeating-linear-gradient(-45deg,rgba(255,106,85,.75) 0 4px,rgba(255,106,85,.2) 4px 8px)}
.meter .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(243,239,226,.55)}
.scale{display:flex;justify-content:space-between;font:10.5px/1 var(--f-mono);color:var(--faint);margin-top:-4px}
.facts{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:11.5px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding-top:9px}
.day{position:relative;display:grid;justify-items:center;gap:3px;padding:7px 1px 6px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:10.5px;min-width:0}
.day .dt{font:700 14px/1 var(--f-body)}
.day .dw{font-size:10px;line-height:1;color:var(--mute)}
.day.sat .dw{color:var(--sky)}.day.sun .dw{color:var(--rose)}
.day svg{width:24px;height:24px}
.day .u{font:700 11px/1 var(--f-body);color:var(--mute);font-variant-numeric:tabular-nums}
.day .bar{width:72%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.day .bar i{display:block;height:100%;background:var(--yolk)}
.day.fut{background:transparent;border-style:dashed}
.day.fut .bar i{background:repeating-linear-gradient(-45deg,rgba(255,217,49,.7) 0 2px,rgba(255,217,49,.2) 2px 4px)}
.day.today{border-color:var(--yolk);box-shadow:inset 0 0 0 1px var(--yolk)}
.day.fog{border-color:var(--alarm);border-style:solid;background:rgba(255,106,85,.08)}
.day.gone{opacity:.45}
.day .tg{position:absolute;top:-9px;left:50%;transform:translateX(-50%) skewX(var(--skew));font-size:9.5px;line-height:1;padding:3px 4px 2px;background:var(--yolk);color:var(--yolk-ink);font-weight:700;white-space:nowrap}
.day .tg.rs{background:var(--teal);color:var(--teal-ink)}
.day .tg.fg{background:var(--alarm);color:#1c0703}
.urow{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.urow .nm{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden;white-space:nowrap}
.urow .nm .n{font-weight:700;color:var(--teal)}
.urow .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.urow .bar i{display:block;height:100%;background:var(--teal)}
.urow .v{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap;font-size:11.5px}
.urow.tot{border-top:1px solid var(--line);padding-top:7px}
.urow.tot .v{color:var(--ink)}

/* social links */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-size:11.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--rim);background:transparent;color:var(--mute)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.card{position:relative;border:0;padding:0;background:none;text-align:left;display:grid;gap:5px;min-width:0}
.card .face{position:relative;aspect-ratio:7/11;max-width:100%;border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  background:linear-gradient(180deg,#151b2a,#090c15);border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 16px rgba(0,0,0,.5);transition:box-shadow .3s,transform .3s}
.card .face::after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,217,49,.22);border-radius:7px;pointer-events:none}
.card .num{font-family:var(--f-disp);font-size:12px;line-height:1;text-align:center;padding-top:8px;color:var(--yolk)}
.card canvas{width:100%;height:100%;display:block;min-height:0}
.card .ar{font-size:9.5px;line-height:1;text-align:center;padding-bottom:8px;color:var(--mute);letter-spacing:.1em}
.card .lb{display:grid;gap:2px;padding:0 2px}
.card .lb b{font-size:11.5px;line-height:1.3;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .lb small{font-size:10px;line-height:1.2;color:var(--faint);display:flex;justify-content:space-between;gap:4px}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;transform:rotate(45deg);background:rgba(255,255,255,.16)}
.pips i.on{background:var(--yolk)}
.card.k-tool .face{border-color:rgba(63,230,214,.3)}
.card.k-skill .face{border-color:rgba(255,217,49,.35)}
.card.k-agent .face{border-color:rgba(255,134,192,.35)}
.card.k-mcp .face{border-color:rgba(147,180,255,.35)}
.card:hover .face{transform:translateY(-3px)}
.card.on .face{box-shadow:0 0 0 1px var(--teal),0 0 24px rgba(63,230,214,.5)}
.card.locked .face{filter:grayscale(1) brightness(.55)}
.card.up .face{animation:rankup 1.4s ease}
@keyframes rankup{0%{transform:rotateY(0)}35%{transform:rotateY(90deg);filter:brightness(2.5)}70%{transform:rotateY(0);box-shadow:0 0 0 2px var(--yolk),0 0 36px rgba(255,217,49,.8)}100%{transform:rotateY(0)}}

/* details */
.ctxBig{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.ctxBig b{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.ctxBig span{font-size:12px;color:var(--mute)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.07)}
.stack i{display:block;height:100%;min-width:2px}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px;font-size:11.5px;color:var(--mute)}
.legend li{display:flex;gap:6px;align-items:center;min-width:0}
.legend li i{flex:none;width:9px;height:9px;border-radius:2px;background:var(--c)}
.legend li b{margin-left:auto;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.tbars{display:block;width:100%;height:76px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.list li{display:flex;gap:8px;align-items:baseline;min-width:0}
.list li .x{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .r{margin-left:auto;color:var(--faint);font-size:11.5px;white-space:nowrap}
.list li .st{flex:none;font:700 11px/1 var(--f-body);width:1.4em;color:var(--faint)}
.list li.doing .st{color:var(--yolk)}
.list li.done .st{color:var(--teal)}
.list li.done .x{color:var(--mute)}
.list .add{color:var(--teal)}.list .del{color:var(--alarm)}
.list code{font-size:11.5px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:500;color:var(--faint);font-size:11px}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.cmd{display:flex;gap:8px;align-items:center;min-width:0;background:rgba(0,0,0,.4);border:1px solid var(--rim);border-radius:12px;padding:7px 8px 7px 12px}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:12px}


/* ---------- toasts, sheet ---------- */
.toasts{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);align-content:end;z-index:40;display:grid;gap:8px;width:min(350px,calc(100vw - 32px));pointer-events:none}
.toast{--r:16px;padding:11px 14px 11px;display:grid;gap:4px;pointer-events:auto;cursor:default;animation:tin .4s cubic-bezier(.2,.9,.2,1);background:linear-gradient(160deg,rgba(40,44,58,.92),rgba(16,18,28,.94))}
.toast[data-n]{cursor:pointer}
.toast .k{justify-self:start}
.toast b{font-size:13px;line-height:1.4}
.toast p{margin:0;font-size:12px;color:var(--mute);line-height:1.5}
.toast.out{opacity:0;transform:translateX(20px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
.scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(3,4,8,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet{--r:26px;border-radius:var(--r);border:1px solid var(--rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 80px rgba(0,0,0,.6);width:min(780px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:grid;gap:14px;align-content:start;background:linear-gradient(160deg,rgba(32,36,50,.98),rgba(11,13,21,.99))}
.sheet h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1.3;letter-spacing:.04em;word-break:auto-phrase;text-wrap:pretty}
.sheet .sub{margin:0;font-size:12.5px;color:var(--mute);line-height:1.7}
.sheet h3{margin:4px 0 0;font:700 14.5px/1.35 var(--f-body);letter-spacing:.04em}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.projs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:0;margin:0;padding:0}
.projs label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;align-items:center;padding:9px 11px;border:1px solid var(--rim);border-radius:12px;cursor:pointer;font-size:13px}
.projs label small{grid-column:2;color:var(--faint);font-size:11px}
.projs label:has(input:checked){border-color:var(--yolk);background:rgba(255,217,49,.07)}
.projs input{accent-color:var(--yolk)}
.found{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 14px;font-size:12.5px;padding:12px;border-radius:14px;background:var(--well);border:1px solid rgba(255,255,255,.07)}
.found div{display:grid;gap:1px;min-width:0}
.found b{font-weight:500}
.found span{color:var(--mute);font-size:11.5px;overflow-wrap:anywhere}
.past{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.past li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.past li small{grid-column:1;color:var(--faint);font-size:11.5px}
.past li .btns{grid-row:1/3;grid-column:2}

/* ---------- pickers: /resume, /model and /effort, chosen here ---------- */
.sheet.pick{width:min(720px,100%)}
.pfoot{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pfoot .sub{flex:1 1 320px}
.pfoot .btn{flex:none}
.psearch{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:12px;border:1px solid var(--rim);background:rgba(0,0,0,.25);color:var(--ink);font:500 13.5px/1.4 var(--f-body)}
.psearch:focus{outline:2px solid var(--teal);outline-offset:1px}
.plist{list-style:none;margin:0;padding:0 2px 0 0;display:grid;gap:8px;max-height:min(52vh,460px);overflow:auto;scrollbar-width:thin}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.plist li.on{border-color:rgba(63,230,214,.5);background:rgba(63,230,214,.06)}
.plist .pt{display:grid;gap:1px;min-width:0}
.plist .pt b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pt span{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist small{grid-column:1;color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .btns{grid-row:1/3;grid-column:2}
.plist li.pempty,p.pempty{display:block;margin:0;color:var(--mute);font-size:12.5px;border-style:dashed}
.pbusy,.pcur{font-size:11.5px;color:var(--mute);white-space:nowrap}
.pcur{color:var(--teal);font-weight:700}
.pnote{margin:0;font-size:12.5px;line-height:1.7;color:var(--yolk);padding:8px 12px;border-radius:12px;background:rgba(255,217,49,.07);border:1px solid rgba(255,217,49,.25)}
.eff{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.eff button{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--rim);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.eff button:hover{background:rgba(255,255,255,.09)}
.eff button.on{border-color:var(--teal);background:rgba(63,230,214,.1)}
.eff b{font-weight:700;font-size:14px}
.eff code{font-size:11px;color:var(--teal)}
.eff small{font-size:11.5px;color:var(--mute);line-height:1.5}
@media (max-width:620px){ .plist li{grid-template-columns:minmax(0,1fr)} .plist .btns{grid-row:auto;grid-column:1} .eff{grid-template-columns:repeat(2,minmax(0,1fr))} }
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- コミュ: a card, opened (the overlay with the wheel at the right edge) ---------- */
.co{position:fixed;inset:0;z-index:55;overflow:hidden;outline:none;--ww:min(400px,34vw);--fz:1}
.co[hidden]{display:none}
.coBg{position:absolute;inset:0;background:radial-gradient(60% 85% at 100% 50%,rgba(255,217,49,.14),transparent 62%),linear-gradient(100deg,rgba(3,4,9,.95),rgba(6,8,16,.88) 55%,rgba(9,11,19,.8));
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);animation:coFade .25s ease both}
.coBg::before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(-64deg,rgba(255,255,255,.035) 0 2px,transparent 2px 28px);animation:coDrift 16s linear infinite}
.coBg::after{content:"";position:absolute;left:-8%;top:52%;width:78%;height:40%;background:#000;opacity:.5;transform:skewY(-8deg);clip-path:polygon(0 28%,100% 0,100% 72%,0 100%)}
@keyframes coFade{from{opacity:0}}
@keyframes coDrift{to{transform:translateX(-128px)}}
.co.out>*{animation:coOut .2s ease both}
@keyframes coOut{to{opacity:0}}
.coTop{position:absolute;z-index:4;left:22px;top:16px;right:calc(var(--ww) + 12px);display:grid;gap:14px;animation:coFade .3s ease both}
.coHead{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.coFilRow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-left:4px}
.coTitle{margin:0;font:400 24px/1 var(--f-disp);letter-spacing:.1em;color:#000;background:var(--yolk);padding:7px 20px 6px;transform:skewX(-10deg);box-shadow:4px 4px 0 #000}
.coTitle>span{display:inline-block;transform:skewX(10deg)}
.coBack{display:inline-flex;align-items:center;gap:8px;border:2px solid #fff;background:#000;color:#fff;font:400 15px/1 var(--f-disp);letter-spacing:.06em;padding:9px 16px 8px 12px;transform:skewX(-12deg);box-shadow:4px 4px 0 var(--yolk);cursor:pointer}
.coBack>span{display:inline-block;transform:skewX(12deg)}
.coBack:hover{background:var(--yolk);color:#000;border-color:#000;box-shadow:4px 4px 0 #fff}
.coSub{font-size:12px;color:var(--mute)}
.coKeys{margin-left:auto;font-size:11.5px;color:var(--faint)}
.coBody{position:absolute;z-index:2;left:0;top:0;bottom:0;right:var(--ww);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px 36px;padding:var(--top,76px) 32px 30px 54px;overflow:auto;scrollbar-width:thin}
.coFil{display:flex;gap:7px;flex-wrap:wrap}
.coFil button{border:2px solid #fff;background:#000;color:#fff;font:400 12.5px/1 var(--f-disp);letter-spacing:.04em;padding:7px 11px 6px;transform:skewX(-10deg);box-shadow:3px 3px 0 rgba(0,0,0,.55);cursor:pointer;white-space:nowrap}
.coFil button>span{display:inline-flex;gap:6px;align-items:baseline;transform:skewX(10deg)}
.coFil button small{font:600 11px/1 var(--f-body);opacity:.75}
.coFil button:hover{border-color:var(--yolk)}
.coFil button[aria-pressed="true"]{background:var(--yolk);color:#000;border-color:#000;box-shadow:3px 3px 0 #fff}
.coSort select{background:#000;color:#fff;border:2px solid #fff;padding:6px 10px;font:500 12.5px/1.2 var(--f-body);cursor:pointer}
.coNone{display:grid;gap:8px;padding:30px 26px;border:2px dashed rgba(255,255,255,.3);font-size:13px;color:var(--mute)}
.coNone b{font:400 20px/1.3 var(--f-disp);color:var(--ink)}
.coInfo{max-width:640px;display:grid;gap:16px;align-content:center;min-width:0;justify-self:end;width:100%}
.coInfo.still *{animation:none!important}
.coSrc{justify-self:start;display:inline-flex;gap:10px;align-items:baseline;background:#000;color:#fff;border:2px solid #fff;padding:5px 13px 4px;font-size:12.5px;transform:rotate(-5deg) skewX(-8deg);margin:0 0 -10px 30px;position:relative;z-index:2;animation:coIn .35s cubic-bezier(.2,.9,.25,1) both}
.coSrc b{font-family:var(--f-disp);font-weight:400;color:var(--yolk);letter-spacing:.08em}
.coName{position:relative;z-index:1;justify-self:start;margin:0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px 2px;padding:16px 26px 18px 16px;transform:rotate(-4deg);transform-origin:20% 100%;font-family:var(--f-disp);font-weight:400;line-height:1;max-width:100%}
.coName::before{content:"";position:absolute;inset:0 -10px 0 -8px;background:#000;clip-path:polygon(2% 10%,100% 0,97% 100%,0 86%);z-index:-1;box-shadow:0 0 0 2px #fff;animation:coSlab .4s cubic-bezier(.2,.9,.25,1) both}
.coName::after{content:"";position:absolute;z-index:-2;left:-14px;right:30px;bottom:-11px;height:12px;background:var(--yolk);clip-path:polygon(0 35%,100% 0,98% 100%,1% 100%)}
.coName .lw{display:inline-flex;align-items:flex-end;gap:3px 2px;white-space:nowrap}
.lt{display:inline-block;font-size:calc(var(--fs)*var(--k,1)*var(--fz));line-height:1;padding:.1em .1em .03em;transform:rotate(var(--r));animation:ltIn .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(70ms + var(--i)*26ms)}
.lt.s0{background:#f6f2e6;color:#000}
.lt.s1{background:#000;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.lt.s2{color:#fff;text-shadow:3px 3px 0 #000}
.lt.s3{background:var(--yolk);color:#000}
@keyframes ltIn{0%{opacity:0;transform:translateY(-45%) scale(1.9) rotate(calc(var(--r)*-4))}60%{opacity:1}}
@keyframes coSlab{from{clip-path:polygon(2% 10%,2% 10%,0 86%,0 86%)}}
@keyframes coIn{from{opacity:0;transform:translateX(-60px) skewX(10deg)}}
.coRank{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;margin:8px 0 4px}
.coStar{width:92px;height:92px;flex:none;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.6));animation:starIn .6s cubic-bezier(.2,1.6,.4,1) both .18s}
.coStar polygon{fill:#000;stroke:#fff;stroke-width:3;stroke-linejoin:round}
.coStar text{font:400 38px var(--f-disp);fill:var(--yolk);stroke:#000;stroke-width:6px;paint-order:stroke;letter-spacing:-.02em}
.coStar text.sm{font-size:28px}
@keyframes starIn{from{opacity:0;transform:scale(.2) rotate(-140deg)}}
.coMeter{display:grid;gap:6px;flex:1;min-width:190px;max-width:320px;animation:coIn .45s cubic-bezier(.2,.9,.25,1) both .1s}
.coMeter .n{font:400 15px/1 var(--f-osd);color:#fff;letter-spacing:.06em}
.coBar{position:relative;height:16px;background:#000;border:2px solid #fff;transform:skewX(-20deg);overflow:hidden}
.coBar i{position:absolute;left:0;top:0;bottom:0;background:var(--yolk);transform-origin:left;animation:barIn .7s cubic-bezier(.2,.9,.25,1) both .25s}
@keyframes barIn{from{transform:scaleX(0)}}
.coMeter small{font-size:12px;color:var(--mute)}
.coArc{display:grid;gap:2px;justify-items:start;animation:coIn .45s cubic-bezier(.2,.9,.25,1) both .16s}
.coArc b{font:400 24px/1 var(--f-disp);color:var(--yolk);text-shadow:3px 3px 0 #000}
.coArc span{font-size:13px;color:var(--ink);letter-spacing:.12em}
.coPw{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(7px 9px 0 rgba(0,0,0,.55));animation:coIn .45s cubic-bezier(.2,.9,.25,1) both}
.coPw.dark{transform:rotate(-1.3deg);animation-delay:.14s}
.coPw.l1{transform:rotate(1deg) translateX(18px);animation-delay:.22s;margin-top:-4px}
.coPw.l2{transform:rotate(-.7deg) translateX(40px);animation-delay:.3s;margin-top:-6px}
.coP{padding:17px 26px 19px 24px;display:grid;gap:10px}
.coPw.dark .coP{background:#05060a;color:#f3efe2;clip-path:polygon(0 7%,3% 0,100% 5%,99% 100%,2% 95%)}
.coPw.l1 .coP,.coPw.l2 .coP{background:#f6f2e6;color:#121212;clip-path:polygon(1% 0,100% 7%,98% 93%,5% 100%,0 62%)}
.coP h3{margin:0;display:flex;align-items:baseline;gap:12px;font:400 15px/1.2 var(--f-disp);letter-spacing:.08em}
.coP h3 small{font-family:var(--f-body);font-size:11.5px;letter-spacing:0;opacity:.6}
.coPw.dark h3{color:var(--yolk)}
.coP p{margin:0;font-size:14px;line-height:1.8}
.coP em{font-style:normal;color:var(--yolk);font-weight:700}
.coP .why{font-size:12px;color:var(--mute);line-height:1.7}
.coFacts{display:flex;flex-wrap:wrap;gap:6px}
.coFacts span{display:inline-flex;gap:6px;align-items:baseline;font-size:12px;padding:3px 9px 2px;border:1px solid rgba(255,255,255,.28)}
.coFacts i{font-style:normal;color:var(--faint);font-size:11px}
.coPw.l1 .rows{display:grid;gap:7px}
.coPw.l1 .urow{grid-template-columns:minmax(6em,11em) minmax(0,1fr) auto}
.coPw.l1 .urow .nm .n{color:#000;font-weight:700}
.coPw.l1 .urow .bar{background:rgba(0,0,0,.12)}
.coPw.l1 .urow .bar i{background:#121212}
.coPw.l1 .urow .v{color:#444}
.coPw.l2 .list li .st{color:#000;font-weight:700;width:2.6em}
.coPw.l2 .list li .r{color:#555}
.coP .none{margin:0;font-size:12.5px;color:#666;list-style:none}
.coCard{width:clamp(190px,17vw,250px);perspective:1000px;animation:coCardIn .6s cubic-bezier(.2,.9,.25,1) both .1s}
@keyframes coCardIn{from{opacity:0;transform:translateY(40px) rotate(12deg)}}
.coCard .card{pointer-events:none;transform:rotate(5deg)}
.coCard .card .num{font-size:16px}
.coCard .card .ar{font-size:11px}
.coCard .card:not(.nocard) .nc{display:none}
.coCard .card.nocard canvas{display:none}
.coCard .face{box-shadow:0 0 0 2px rgba(255,217,49,.55),0 28px 60px rgba(0,0,0,.65),0 0 70px rgba(255,217,49,.16);animation:coFloat 6s ease-in-out infinite}
.coCard .card.flip .face{animation:coFlip .6s cubic-bezier(.2,.9,.3,1),coFloat 6s ease-in-out .6s infinite}
.coCard .card.locked .face{filter:grayscale(1) brightness(.6)}
@keyframes coFlip{0%{transform:rotateY(-100deg) scale(.86);filter:brightness(2.2)}100%{transform:none;filter:none}}
@keyframes coFloat{50%{transform:translateY(-10px)}}
.coWheel{position:absolute;z-index:3;right:0;top:0;bottom:0;width:var(--ww);touch-action:none;cursor:grab;animation:coWheelIn .6s cubic-bezier(.2,.9,.25,1) both}
@keyframes coWheelIn{from{opacity:0;transform:translateX(35%)}}
.coWheel.drag{cursor:grabbing}
.coWheel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.coNav{position:absolute;top:50%;right:220px;transform:translateY(-50%);display:grid;justify-items:center;gap:8px}
.coPos{font:400 13px/1 var(--f-osd);color:var(--yolk);letter-spacing:.06em;background:#000;border:1px solid rgba(255,217,49,.55);padding:6px 9px 5px;transform:skewX(-10deg);white-space:nowrap;pointer-events:none}
.coB{width:40px;height:34px;border:2px solid #000;background:var(--yolk);color:#000;font:700 13px/1 var(--f-body);transform:skewX(-10deg);box-shadow:3px 3px 0 #000;cursor:pointer}
.coB:hover{filter:brightness(1.08)}
.co.bm{--ww:100%;--wh:min(210px,31vh);--fz:.62}
.co.bm .coWheel{left:0;right:0;top:auto;bottom:0;width:auto;height:var(--wh)}
.co.bm .coBody{right:0;bottom:var(--wh);grid-template-columns:minmax(0,1fr);padding:var(--top,68px) 16px 18px 18px}
.co.bm .coFil{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:2px 4px 6px 2px;scrollbar-width:none}
.co.bm .coFil::-webkit-scrollbar{display:none}
.co.bm .coTop{right:16px;left:14px;top:12px;gap:10px}
.co.bm .coTitle{font-size:19px;padding:6px 14px 5px}
.co.bm .coKeys,.co.bm .coSub{display:none}
.co.bm .coCard{display:none}
.co.bm .coNav{display:flex;align-items:center;left:12px;right:12px;top:10px;transform:none}
.co.bm #coNext{margin-left:auto}
.co.bm .coStar{width:68px;height:68px}
.co.bm .coPw.l1{transform:rotate(1deg) translateX(6px)}
.co.bm .coPw.l2{transform:rotate(-.7deg) translateX(12px)}
.co.bm .coP{padding:14px 18px 16px}
.co.bm .coInfo{justify-self:stretch}
@media (max-width:1100px){
  .co{--ww:min(330px,40vw);--fz:.84}
  .coCard{display:none}
  .coBody{grid-template-columns:minmax(0,1fr);padding-left:30px}
  .coKeys{display:none}
}
.rankline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px}
.rankline .pips i{width:9px;height:9px}
.rankline b{font-family:var(--f-disp);font-weight:400;font-size:18px}


/* ---------- command palette ---------- */
.ctl{position:relative}
.pal{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:20;max-height:min(420px,56vh);display:grid;grid-template-rows:auto minmax(0,1fr) auto;border-radius:18px;overflow:hidden;
  background:linear-gradient(160deg,rgba(34,38,54,.98),rgba(12,14,22,.99));border:1px solid var(--rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 22px 60px rgba(0,0,0,.6)}
.palhd{display:flex;gap:10px;align-items:center;padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.palhd .s{font-size:11.5px;color:var(--mute)}
#palList{list-style:none;margin:0;padding:4px 6px 6px;overflow:auto;scrollbar-width:thin}
#palList .pg{font-size:10.5px;color:var(--faint);letter-spacing:.12em;padding:8px 8px 3px}
.po{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:12.5px}
.po code{font-size:12.5px;color:var(--ink);font-weight:600;background:none;padding:0}
.po .h{font:11px/1 var(--f-mono);color:var(--faint)}
.po .d{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.po .kd{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--rim);color:var(--mute);white-space:nowrap}
.po .kd.k-turn{color:var(--teal);border-color:rgba(63,230,214,.4)}
.po .kd.k-panel{color:var(--sky);border-color:rgba(147,180,255,.4)}
.po .kd.k-danger{color:var(--alarm);border-color:rgba(255,106,85,.5)}
.po .kd.k-op{color:var(--yolk);border-color:rgba(255,217,49,.45)}
.po .kd.k-pick{color:var(--teal);border-color:rgba(63,230,214,.45);background:rgba(63,230,214,.08)}
.po .kd.k-term{color:var(--faint);border-style:dashed}
/* after @: the channel's files, the folder dim and the name bright */
.po.pf{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.po.pf code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.po.pf .dp{color:var(--faint);font-weight:500}
.po.on.pf .dp{color:rgba(21,17,10,.62)}
.po .kd.k-dir{color:var(--sky);border-color:rgba(147,180,255,.4)}
.po:hover{background:rgba(255,255,255,.06)}
.po.on{background:var(--yolk);color:var(--yolk-ink)}
.po.on code,.po.on .d,.po.on .h{color:var(--yolk-ink)}
/* on the chosen (yellow) row every kind turns to ink: no teal or red on yellow */
.po.on .kd{background:var(--yolk-ink);border-color:var(--yolk-ink);border-style:solid;color:var(--yolk)}
.palft{font-size:11px;color:var(--faint);padding:7px 14px;border-top:1px solid var(--line)}
#bCmd b{font-family:var(--f-mono);color:var(--yolk)}
.cmdo{display:grid;gap:8px;border-radius:14px;padding:11px 13px;background:rgba(63,230,214,.05);border:1px solid rgba(63,230,214,.25)}
.cmdo .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cmdo .hd .s{font-size:11.5px;color:var(--mute)}
.cmdo pre{margin:0;font:12px/1.7 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.cmdo p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.7}
.cmdo.panel{background:rgba(147,180,255,.05);border-color:rgba(147,180,255,.28)}
/* where a conversation was swapped (/resume), and the last exchanges of the one returned to */
.sys.res{border-style:solid;border-color:rgba(63,230,214,.45);background:rgba(63,230,214,.06)}
.histBox{border:1px dashed rgba(255,255,255,.16);border-radius:14px;padding:9px 12px}
.histBox summary{cursor:pointer;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.histBox summary b{color:var(--ink);font-weight:600}
.histIn{display:grid;gap:12px;margin-top:10px;opacity:.88}

/* ---------- approvals from the browser ---------- */
.pbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.pbtns .cd{font:600 12px/1 var(--f-mono);color:var(--yolk)}
.linkbtn{justify-self:start;border:0;background:none;padding:0;color:var(--teal);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.op.note .v{color:var(--yolk)}
.op.denied .v,.op.denied .r{color:var(--alarm)}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--well);border:1px solid rgba(255,255,255,.07)}
.swrow span{display:grid;gap:2px}
.swrow small{font-size:11.5px;color:var(--mute)}
.setGuide .btn{flex:none;text-decoration:none;color:var(--ink)}
.setGuide small code{font-size:11px}
.sw{position:relative;flex:none;width:54px;height:30px;border-radius:999px;border:1px solid var(--rim);background:rgba(255,255,255,.1);padding:0;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.sw[aria-checked="true"]{background:var(--yolk);border-color:var(--yolk)}
.sw[aria-checked="true"] i{transform:translateX(24px);background:var(--yolk-ink)}
.pair{display:grid;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,217,49,.4);background:rgba(255,217,49,.05)}
.pair p{margin:0;font-size:12.5px;line-height:1.7}
.term{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:#05070c;border:1px solid var(--line)}
.term .tl{font-size:10.5px;color:var(--faint)}
.term code{font-size:12.5px;color:var(--teal);white-space:pre-wrap;overflow-wrap:anywhere}
.pairrow{display:flex;flex-wrap:wrap;gap:8px}
.pairrow input{flex:1;min-width:140px;background:rgba(0,0,0,.4);border:1px solid var(--rim);border-radius:12px;padding:9px 12px;font:15px/1.2 var(--f-mono);letter-spacing:.08em}
.err{margin:0;color:var(--alarm);font-size:12.5px}
/* pairing: where the code is, drawn as the terminal shows it */
.sheet .hdR{display:flex;gap:8px;align-items:center}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.pairHd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pairHd b{font-size:13.5px}
.pairHd .left{font:600 13px/1 var(--f-mono);color:var(--yolk);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.where{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center}
@media(max-width:640px){.where{grid-template-columns:minmax(0,1fr)}}
.tmock{display:grid;gap:6px;padding:9px 11px 11px;border-radius:12px;background:#05070c;border:1px solid var(--line);font:11.5px/1.45 var(--f-mono);color:var(--mute);min-width:0}
.tmT{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--faint)}
.tmT i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18)}
.tmT span{margin-left:6px;font-family:var(--f-body)}
.tmL{color:var(--faint)}
.tmRow{display:flex;align-items:center;gap:8px;min-width:0}
.tmBand{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;padding:5px 8px;border:1.5px solid var(--yolk);border-radius:8px;color:var(--yolk);font-weight:600;box-shadow:0 0 0 3px rgba(255,217,49,.12)}
.tmCode{background:var(--yolk);color:var(--yolk-ink);padding:0 6px;border-radius:3px;letter-spacing:.06em}
.tmP{display:flex;gap:6px;align-items:center;padding:4px 8px;border:1px solid rgba(255,255,255,.14);border-radius:6px;color:var(--ink)}
.tmP .cur{width:7px;height:13px;background:var(--ink);animation:blink 1.1s steps(1) infinite}
.tmSl{flex:1;min-width:0;font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmSl b{color:var(--yolk);font-weight:600}
.tmTag{flex:none;font:400 11px/1.4 var(--f-disp);color:var(--yolk-ink);background:var(--yolk);padding:1px 7px 0;transform:skewX(var(--skew));box-shadow:2px 2px 0 #000;letter-spacing:.04em}
.where p{margin:0;font-size:12.5px;line-height:1.75}
.where p b{color:var(--yolk)}
.pairFt{display:flex;gap:18px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.tmP .cur{animation:none}}
.rules{margin:0;padding-left:1.2em;display:grid;gap:5px;font-size:12px;color:var(--mute);line-height:1.6}

/* ---------- social links at scale ---------- */
.dctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.dctl input,.dctl select{min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--rim);border-radius:10px;padding:7px 10px;font-size:12.5px}
.dctl .seg{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--rim);border-radius:10px;overflow:hidden;justify-self:start}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:12px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.how summary{cursor:pointer;font-size:12px;color:var(--teal)}
.how p{margin-top:6px}
.card.minor .num{color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:11px}
.card.nocard .face{place-items:center;grid-template-rows:auto 1fr auto;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px),#0b0e16}
.card.nocard .nc{align-self:center;font-size:13px;color:var(--faint)}
.dlist ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lhead,.lrow{display:grid;grid-template-columns:4.6em minmax(0,1fr) 6.2em 3.6em 3.6em;gap:8px;align-items:center}
.lhead{font-size:10.5px;color:var(--faint);padding:0 8px 4px}
.lhead span:nth-child(n+3){text-align:right}
.lrow{width:100%;text-align:left;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);border-radius:10px;padding:7px 8px;font-size:12px}
.lrow:hover{border-color:rgba(255,217,49,.45)}
.lrow.on{border-color:var(--teal);box-shadow:0 0 14px rgba(63,230,214,.25)}
.lrow .ln{font:700 11.5px/1.2 var(--f-body);color:var(--yolk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.k-skill .ln{color:var(--yolk)}.lrow.k-agent .ln{color:var(--rose)}.lrow.k-mcp .ln{color:var(--sky)}.lrow.k-tool .ln{color:var(--teal)}
.lrow .lnm{display:grid;gap:1px;min-width:0}
.lrow .lnm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lnm small{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lrk{display:grid;justify-items:end;gap:3px}
.lrow .lrk .pips i{width:4px;height:4px}
.lrow .lrk small{font-size:10.5px;color:var(--mute);white-space:nowrap}
.lrow .llast,.lrow .ltok{text-align:right;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
#unused .list .st{width:2.4em;font-size:10px}

/* ---------- live page ---------- */
.flow{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;min-width:0}
.flow:empty{display:none}
.solo .flow{gap:8px}
.ans pre{margin:6px 0;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.you .more{color:var(--faint);font-size:12px}
.rx.lost{color:var(--alarm)}
.rx.lost i{background:var(--alarm);box-shadow:0 0 8px var(--alarm)}
.wallEmpty{grid-column:1/-1;padding:28px 22px;border:1px dashed rgba(255,255,255,.2);border-radius:16px;display:grid;gap:8px;font-size:13px;color:var(--mute);line-height:1.7}
.wallEmpty b{font-family:var(--f-disp);font-weight:400;color:var(--ink);font-size:17px;letter-spacing:.04em}
.wallEmpty code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px}
.op.note.denied .x{color:var(--alarm)}

/* ---------- the conversation as a messenger ----------
   You on the right in a yellow bubble; Claude on the left in white, under a tilted frame; its work log
   sits in Claude's column. Hard black shadows and cut tails, the way the menus are drawn. */
.log{gap:16px}
.turn{gap:10px}
.turn .full{gap:10px}
.fold{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.09);border-radius:0;padding:4px 2px 7px;font-size:12px;color:var(--faint)}
.fold:hover{border-color:rgba(255,217,49,.45)}
.fold .tm{font-variant-numeric:tabular-nums}
.fold .p{display:none}
.fold .k{margin-left:auto}
.fold .chev{flex:none;font-weight:700;color:var(--mute)}
.fold .chev::before{content:"たたむ ▴"}
.fold:hover .chev{color:var(--yolk)}
.turn.folded .fold{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:9px 12px;color:var(--mute)}
.turn.folded .fold .p{display:block;flex:1;min-width:0;color:var(--ink)}
.turn.folded .fold .k{margin-left:0}
.turn.folded .fold .chev::before{content:"ひらく ▾"}
.turn.folded .fold:hover{border-color:rgba(255,217,49,.45)}

.you{display:flex;justify-content:flex-end;align-items:flex-end;gap:10px;max-width:none;width:100%}
.you .meta{flex:none;display:grid;justify-items:end;gap:2px;font-size:11px;line-height:1.3;color:var(--faint);padding-bottom:3px;white-space:nowrap}
.you .meta time{font-variant-numeric:tabular-nums}
.you .body{position:relative;max-width:min(78%,660px);padding:10px 15px;border-radius:16px 16px 4px 16px;background:var(--yolk);color:var(--yolk-ink);box-shadow:3px 3px 0 #000;font-size:14.5px;line-height:1.75;font-weight:500;overflow-wrap:anywhere}
.you .body::after{content:"";position:absolute;right:-10px;bottom:7px;width:14px;height:13px;background:var(--yolk);clip-path:polygon(0 0,100% 62%,0 100%)}
.you .body code{background:rgba(0,0,0,.12);color:var(--yolk-ink)}
.you .more{color:rgba(21,17,10,.6)}
/* under a request from this screen: the files it named with @, as they went to Claude */
.you .att{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin-top:8px;padding-top:7px;border-top:1px dashed rgba(21,17,10,.28)}
.you .att .ak{font:700 10.5px/1 var(--f-body);letter-spacing:.12em;color:rgba(21,17,10,.6)}
.you .att .af{display:inline-flex;gap:6px;align-items:baseline;max-width:100%;padding:2px 9px 3px;border-radius:999px;background:rgba(21,17,10,.12);font:600 11.5px/1.5 var(--f-mono);overflow-wrap:anywhere}
.you .att .af small{font:600 10.5px/1 var(--f-body);color:rgba(21,17,10,.62)}
.you .att .af.bad{background:none;outline:1px dashed rgba(21,17,10,.4);color:rgba(21,17,10,.6)}
.you .att .af.ref{background:none;outline:1px solid rgba(21,17,10,.38)}

.flow{position:relative;padding-left:54px;gap:9px}
.solo .flow{padding-left:0}
.aihd{display:flex;align-items:center;gap:9px;margin-left:-54px;min-height:42px}
.aihd .av{flex:none;width:42px;height:42px;display:grid;place-items:center;color:var(--yolk);background:#06080e;border:2px solid var(--ink);transform:rotate(-4deg) skewX(-6deg);box-shadow:3px 3px 0 var(--teal)}
.aihd .av svg{width:26px;height:26px;transform:skewX(6deg) rotate(4deg)}
.aihd b{font:700 13.5px/1 var(--f-body);color:var(--ink);letter-spacing:.02em}
.aihd span{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.flow > .ans{position:relative;justify-self:start;max-width:min(100%,780px);padding:11px 16px;border:2px solid #000;border-radius:4px 16px 16px 16px;background:#f6f2e7;color:#16130d;box-shadow:3px 3px 0 rgba(0,0,0,.7);font-size:14.5px;line-height:1.85;font-weight:500}
.flow > .ans::before{content:"";position:absolute;left:-13px;top:7px;width:13px;height:15px;background:#000;clip-path:polygon(100% 0,0 30%,100% 100%)}
.flow > .ans.typing::after{color:#0a8f84}
.flow > .ans code{background:rgba(22,19,13,.08);color:#16130d}
.flow > .ans b{color:#000}
.flow > .ans pre{background:#14110c;color:var(--ink);border-color:transparent}
/* tables in Claude's words and in a command's markdown: scroll sideways inside, never the page */
.mdt{margin:6px 0;max-width:100%;overflow-x:auto}
.mdt table{border-collapse:collapse;font-size:12.5px;line-height:1.55;min-width:50%}
.mdt th,.mdt td{padding:4px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
.mdt th{font-weight:700;border-bottom-color:rgba(63,230,214,.45)}
.mdt td:not(:first-child){font-variant-numeric:tabular-nums}
.flow > .ans .mdt th,.flow > .ans .mdt td{border-bottom-color:rgba(22,19,13,.16)}
.flow > .ans .mdt th{border-bottom-color:rgba(22,19,13,.55)}
.cmdmd{font-size:12.5px;line-height:1.7;color:var(--ink);overflow-wrap:anywhere}
.cmdmd .mdt{margin:4px 0 8px}
.flow > .ops{margin:0;padding:7px 11px;max-width:min(100%,780px);border:1px solid rgba(255,255,255,.08);border-left:3px solid rgba(63,230,214,.5);border-radius:10px;background:rgba(0,0,0,.3)}
.flow > .you{margin-left:-54px;width:calc(100% + 54px)}
.flow > .sys{margin-left:-54px}
.log > li > .sys,.flow > .sys{justify-self:center;max-width:min(92%,640px);text-align:center;border-style:solid;border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.035);border-radius:14px;padding:8px 14px}
.log > li > .sys .row{justify-content:center}
.turnFt{padding-left:54px}
@media (max-width:620px){
  .flow{padding-left:44px}
  .aihd{margin-left:-44px}
  .aihd .av{width:34px;height:34px}
  .aihd .av svg{width:21px;height:21px}
  .flow > .you{margin-left:-44px;width:calc(100% + 44px)}
  .flow > .sys{margin-left:-44px}
  .turnFt{padding-left:44px}
  .you .body{max-width:86%}
  .fold .tm{display:none}
}

/* skills tab */
.rtabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.rt span{font-size:12.5px;padding:8px 1px 7px;letter-spacing:.02em}
.sktabs{justify-self:stretch}
.sktabs button{flex:1;display:flex;gap:6px;justify-content:center;align-items:baseline;font-weight:700}
.sktabs button small{font-size:11px;font-weight:500;color:inherit;opacity:.75}
.sktabs button[aria-selected="true"]{background:var(--ink);color:var(--night)}
.sklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sklist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:7px 8px;border-radius:9px;background:rgba(255,255,255,.03)}
.sklist li b{font-size:13.5px;overflow-wrap:anywhere}
.sklist li .r{grid-row:1;grid-column:2;font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.sklist li .src,.sklist li .sc{grid-column:1/-1;justify-self:start;font-size:11.5px;color:var(--faint)}
.sklist .man{color:var(--teal);font-weight:700}
.sc{padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.sc.loc{color:var(--teal)!important}
.sc.glo{color:var(--yolk)!important}

/* ---------- Claude's question (AskUserQuestion): its options as buttons ---------- */
.qcard{position:relative;display:grid;gap:12px;max-width:min(100%,780px);padding:16px 16px 14px;border-radius:4px 16px 16px 16px;background:#0b1013;border:2px solid var(--teal);box-shadow:4px 4px 0 #000}
.qcard::before{content:"";position:absolute;left:-13px;top:7px;width:13px;height:15px;background:var(--teal);clip-path:polygon(100% 0,0 30%,100% 100%)}
.qhd{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.qhd b{font:400 15px/1.2 var(--f-disp);letter-spacing:.06em;color:var(--teal)}
.qhd .s{font-size:12px;color:var(--mute)}
.qq{margin:0;padding:0;border:0;min-width:0;display:grid;gap:9px}
.qq legend{padding:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:9px}
.qq .qh{font:700 11px/1 var(--f-body);color:var(--teal-ink);background:var(--teal);padding:4px 8px 3px;letter-spacing:.04em}
.qq .qt{font-size:15px;font-weight:700;line-height:1.6;color:var(--ink)}
.qq legend small{font-size:11.5px;color:var(--faint)}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.qo{position:relative;display:grid;gap:3px;align-content:start;text-align:left;min-height:52px;padding:10px 14px 10px 36px;border:2px solid rgba(243,239,226,.3);border-radius:12px;background:rgba(255,255,255,.04);color:var(--ink);transition:background .12s,border-color .12s}
.qo::before{content:"";position:absolute;left:12px;top:13px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(243,239,226,.55)}
.qq:has(legend small) .qo::before{border-radius:3px}
.qo b{font-size:14.5px;line-height:1.4}
.qo small{font-size:12px;line-height:1.5;color:var(--mute)}
.qo:hover:not(:disabled){border-color:var(--teal);background:rgba(63,230,214,.08)}
.qo:focus-visible{outline:3px solid #fff;outline-offset:2px}
.qo[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:var(--teal-ink)}
.qo[aria-pressed="true"] small{color:rgba(3,19,15,.75)}
.qo[aria-pressed="true"]::before{border-color:var(--teal-ink);background:radial-gradient(circle,var(--teal-ink) 0 40%,transparent 45%)}
.qq:has(legend small) .qo[aria-pressed="true"]::before{background:var(--teal-ink)}
.qin{display:block;width:100%;background:rgba(0,0,0,.4);border:1px solid var(--rim);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.55;
